<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chess Forge</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#171a21;color:white;text-align:center}
main{max-width:500px;margin:auto;padding:25px 15px}
h1{font-size:36px}
button,input{font-size:18px;padding:12px;margin:6px;border-radius:10px;border:0}
button{cursor:pointer}
#room{margin:20px 0;font-size:22px}
#status{margin:15px;color:#aaa}
.board{display:grid;grid-template-columns:repeat(8,1fr);max-width:400px;margin:25px auto}
.cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:30px}
.light{background:#f0d9b5}
.dark{background:#b58863}
</style>
</head>
<body>
<main>
<h1>♟ Chess Forge</h1>

<input id="name" placeholder="Твоё имя">

<div>
<button onclick="createRoom()">Создать игру</button>
</div>

<div>
<input id="code" placeholder="Код комнаты">
<button onclick="joinRoom()">Войти</button>
</div>

<div id="room">Комната: —</div>
<div id="status">Подключение...</div>

<div id="board" class="board"></div>
</main>

<script>
let ws;
let myPlayer=null;
let roomCode=null;

const pieces=[
"♜","♞","♝","♛","♚","♝","♞","♜",
"♟","♟","♟","♟","♟","♟","♟","♟",
"","","","","","","",
"","","","","","","",
"","","","","","","",
"","","","","","","",
"♙","♙","♙","♙","♙","♙","♙","♙",
"♖","♘","♗","♕","♔","♗","♘","♖"
];

function connect(){
 const protocol=location.protocol==="https:"?"wss":"ws";
 ws=new WebSocket(protocol+"://"+location.host);

 ws.onopen=()=>{
   document.getElementById("status").textContent="Онлайн";
 };

 ws.onclose=()=>{
   document.getElementById("status").textContent="Соединение закрыто";
 };

 ws.onmessage=e=>{
   const m=JSON.parse(e.data);

   if(m.type==="room"){
     roomCode=m.code;
     myPlayer=m.player;
     document.getElementById("room").textContent="Комната: "+roomCode;
     document.getElementById("status").textContent=
       myPlayer===1?"Ты играешь белыми":"Ты играешь чёрными";
     history.replaceState(null,"","/game/"+roomCode);
   }

   if(m.type==="start"){
     document.getElementById("status").textContent="Игра началась!";
   }

   if(m.type==="error"){
     document.getElementById("status").textContent=m.message;
   }

   if(m.type==="opponent_left"){
     document.getElementById("status").textContent="Соперник вышел";
   }
 };
}

function createRoom(){
 if(ws && ws.readyState===1) ws.send(JSON.stringify({type:"create"}));
}

function joinRoom(){
 const code=document.getElementById("code").value.trim().toUpperCase();
 if(!code)return;
 if(ws && ws.readyState===1) ws.send(JSON.stringify({type:"join",code}));
}

function drawBoard(){
 const board=document.getElementById("board");
 board.innerHTML="";

 for(let i=0;i<64;i++){
   const cell=document.createElement("div");
   cell.className="cell "+(((Math.floor(i/8)+i)%2===0)?"light":"dark");
   cell.textContent=pieces[i];
   board.appendChild(cell);
 }
}

drawBoard();
connect();
</script>
</body>
</html>
